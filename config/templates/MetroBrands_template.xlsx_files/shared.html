<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>
	Shared Clipboard iframe content
</title>
  <script type="text/javascript" nonce="">
  var sharedClipboardBypassPolicy = "";
    try {
      var ttTinyFill = {
        createPolicy: (_, options) => options,
      };
      var defaultTTApi = 
        typeof self !== 'undefined' && self.trustedTypes
        ? self.trustedTypes
        : ttTinyFill;
      sharedClipboardBypassPolicy = defaultTTApi.createPolicy('xlSCBypassPolicy', { 
        createScriptURL: (url) => url
      });
    } catch (e) {}

var sharedClipboardSettings = {
 whitelistOriginComponents: 1,
 staticContentURLPrefix: "https://res.public.onecdn.static.microsoft:443/officeonline/clipboard/s/162050242300_App_Scripts/",
 is1CDNEnabled: "True",
 sharedClipboardExpirationInMinutes: 3600,
 clipboardPromiseTimeoutInMinutes: 2,
 sharedClipboardSchemaVersion: 2,
 remoteLoggerPath: "/xt/RemoteUls.ashx",

 sharedClipboardHostingApp: "shared",
 sharedClipboardHostingApps: "[\"broadcast\", \"excel\", \"onenote\", \"powerpoint\", \"view\", \"visio\", \"word-edit\", \"word-view\", \"shared\"]",
 sharedClipboardHostingEnvironments: "[\"officeapps.live.com\", \"office.svc.cloud.microsoft\", \"office.guest.usercontent.microsoft\", \"office.core.microsoft\", \"word.cloud.microsoft\", \"excel.cloud.microsoft\", \"powerpoint.cloud.microsoft\"]"

};

var sharedClipboardScriptFileName = 'sharedclipboard.min.js';

function loadScript(fileName) {
  var scriptElement = document.createElement('script');
  var fileSrc = getScriptSrc(fileName);
  if (sharedClipboardBypassPolicy !== "") {
    var trustedFileName = sharedClipboardBypassPolicy.createScriptURL(fileSrc);
    scriptElement.setAttribute('src', trustedFileName);
  }
  else {
    scriptElement.setAttribute('src', fileSrc);
  }
  scriptElement.setAttribute('type', 'text/javascript');
  scriptElement.setAttribute('async', 'false');
  scriptElement.setAttribute('defer', 'defer');
  if (sharedClipboardSettings.is1CDNEnabled === "True") {
    scriptElement.setAttribute('crossorigin', 'anonymous');
  }
  var body = document.getElementsByTagName('body')[0];
  body.appendChild(scriptElement);
}

function getScriptSrc(fileName) {
  var prefix = sharedClipboardSettings.staticContentURLPrefix;
  if (!prefix) {
    return fileName;
  }

  var queryMark = prefix.indexOf('?');
  if (queryMark < 0) {
    return prefix + fileName;
  }

  var postfix = prefix.substr(queryMark);
  prefix = prefix.substr(0, queryMark);
  return prefix + fileName + postfix;
}
  </script>
 </head>

<body>
  <script nonce="">
    document.body.onload = () => { window.sharedClipboard.initialize(); };
    loadScript(sharedClipboardScriptFileName);
  </script><script src="./sharedclipboard.min.js.download" type="text/javascript" async="false" defer="defer" crossorigin="anonymous"></script>
