

SM12:
  lock_count: "Selected Lock Entries:\\s*(\\d+)"
  # Enqueue Administration rows: "<HH:MM:SS> <client> <USER> <appl comp> <mode>"
  lock_users_list: "^\\d{2}:\\d{2}:\\d{2}\\s+\\d{3}\\s+([A-Z][A-Z0-9_]+)"
  lock_objects_list: "^([A-Z][A-Z0-9_]{6,})\\s+[a-z0-9]+_[A-Z0-9]+_\\d{2}\\s*$"





SOST:
  send_summary: "([\\d,\\.]+\\s*Send Rquests[^\\n]*Error)"

DB12:
  backup_status: "(Backup Successful|Backup Failed)"

DB01:
  blocked_transactions: "(\\d+)\\s*Blocked Transaction"

DB02:
  db_size: "([\\d\\.]+\\s*TB\\s*/\\s*[\\d\\.]+\\s*TB)"


SM58:
  status: "(Nothing was selected\\.)"

ST03N:
  avg_response_time: "Avg\\. dialog response time[^\\d]*([\\d,\\.]+)"

AL08:
  # AL08's footer line: "<n> user sessions with <m> ABAP sessions".
  #
  # These two keys are named to match core/tcode_metrics.py's AL08
  # definitions, so a successful OCR read flows straight into
  # sap.al08.user_logons and sap.al08.backend_sessions without any
  # further plumbing.
  #
  # Why OCR rather than the GridView: action_al08's three candidate
  # GridView IDs all miss on this system, so the structured read returns
  # nothing and the screenshot is the only evidence of what was on
  # screen. Patterns are matched against the FULL OCR text, not the
  # truncated ocr_excerpt, so the footer is always in range however many
  # session rows the grid holds.
  user_logons: "(\\d+)\\s*user sessions?\\s+with"
  back_end_sessions: "with\\s*(\\d+)\\s*ABAP sessions"
SMLG:
  # SMLG's instance table row: <name>|<state icon> <resp ms> <users> <HH:MM:SS>.
  # Structure-matched, not name-matched -- OCR mangles lowercase 'q' in SAP
  # hostnames unreliably, but the pipe + two-number + timestamp shape holds.
  #
  # The response-time group must allow a thousands separator. SMLG prints
  # 1277 ms as "1.277" (or "1,277"), and the previous group -- a bare
  # \\d{1,6} -- could not span the separator, so it backtracked onto the
  # fragment AFTER it and captured 277 for a 1277 ms instance. Anything
  # over 999 ms was under-reported by exactly its thousands digit, which
  # is the range the alert thresholds live in.
  #
  # The leading "|" must be OPTIONAL. It was mandatory, and on a real
  # capture the cell edge left of the figure came through OCR as "/@"
  # rather than "|" -- so a row reading "4.685 21 12:02:27" (4685 ms, a
  # flashing-critical response time) matched nothing and SMLG was filed
  # as UNKNOWN. The trailing timestamp is what actually identifies this
  # row; nothing else on the screen is <number> <integer> <HH:MM:SS>.
  response_time_ms: "(?:\\|\\s*)?(\\d{1,3}(?:[.,]\\d{3})*|\\d{1,6})\\s+\\d+\\s+\\|?\\s*\\d{2}:\\d{2}:\\d{2}"
SM37:
  # Job Overview rows: "<JOBNAME>. <USER> <Status> <dd.mm.yyyy>"
  active_job_names_list: "^\\W*([A-Z0-9_/]{4,})\\.?\\s+[A-Z0-9_]+\\s+(?:Active|Running)\\b"

SM37_CANCELLED:
  cancelled_job_names_list: "^\\W*([A-Z0-9_/]{4,})\\.?\\s+[A-Z0-9_]+\\s+Cancel"
  cancelled_job_users_list: "^\\W*[A-Z0-9_/]{4,}\\.?\\s+([A-Z0-9_]+)\\s+Cancel"

SM58:
  # One row per tRFC entry starts with a date+time; "Nothing was selected." = 0.
  trfc_entries_list: "(\\d{2}\\.\\d{2}\\.\\d{4}\\s+\\d{2}:\\d{2}:\\d{2}[^\\n]{0,90})"
  trfc_empty: "(Nothing was selected)"

SM21:
  # Every syslog row starts dd.mm.yyyy hh:mm:ss.
  syslog_rows_list: "^(\\d{2}\\.\\d{2}\\.\\d{4}\\s+\\d{2}:\\d{2}:\\d{2})"
  # The rows worth a human's attention: failures, invalid certs, dumps, cancels.
  notable_messages_list: "(\\d{2}:\\d{2}:\\d{2}[^\\n]*?(?:failed|invalid|short dump|cancel|error|closed)[^\\n]*)"

SM66:
  # "<host>_<SID>_<nn> <wp> <type> <pid> Running ..."
  active_instances_list: "^([a-z0-9]+_[A-Z0-9]+_\\d{2})\\s+\\d+\\s+(?:DIA|BTC|UPD|SPO|ENQ|UP2)\\b"
  running_processes_list: "^[a-z0-9]+_[A-Z0-9]+_\\d{2}\\s+(\\d+)\\s+(?:DIA|BTC|UPD|SPO|ENQ|UP2)\\s+[\\d.]+\\s+Running"
  running_users_list: "Running[^\\n]*\\s\\d{3}\\s+([A-Z][A-Z0-9_]{2,})\\s*$"
