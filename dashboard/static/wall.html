<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraBeatOps · Live Wall</title>
<link rel="icon" href="/static/brand/favicon.png">
<script>(function(){var t=null;try{t=localStorage.getItem("ibo-theme");}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
<link rel="stylesheet" href="/static/shell.css?v=ds4">
<style>
  /* Sized for a wall monitor: fewer, larger cards; readable across a room. */
  .wall{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
  .sys{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
       overflow:hidden;box-shadow:var(--shadow)}
  .sys.s-normal{border-top:3px solid var(--green)}
  .sys.s-warning{border-top:3px solid var(--amber)}
  .sys.s-critical{border-top:3px solid var(--red)}
  .sys.s-unknown{border-top:3px solid var(--gray)}

  .sh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .sh h3{font-size:17px;font-weight:800}
  .sh .sid{font-family:var(--mono);font-size:11px;color:var(--muted-dim)}
  .sh .right{margin-left:auto;display:flex;align-items:center;gap:8px}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
  .t{background:var(--card);padding:11px 13px}
  .t .k{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
        color:var(--muted-dim);margin-bottom:5px;white-space:nowrap}
  .t .v{font-size:19px;font-weight:800;font-family:var(--mono);line-height:1.15}
  .t .m{font-size:9.5px;color:var(--muted-dim);margin-top:3px}
  .v-normal{color:var(--green)} .v-warning{color:var(--amber)}
  .v-critical{color:var(--red)} .v-unknown{color:var(--muted-dim)}

  .wp{padding:12px 16px;border-top:1px solid var(--border)}
  .wp-head{display:flex;justify-content:space-between;font-size:10px;font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:7px}
  .wp-types{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11px;
        font-family:var(--mono);color:var(--muted)}
  .wp-types b{color:var(--text)}
  .longest{margin-top:9px;font-size:11px;color:var(--amber);font-family:var(--mono)}

  /* Workload from /SDF/SMON_HEADER. Dialog queue leads CPU and memory: it
     rises while users are already waiting and the OS tiles still look fine. */
  .smon{padding:11px 16px;border-top:1px solid var(--border)}
  .smon-head{display:flex;justify-content:space-between;font-size:10px;font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:8px}
  .smon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px 12px}
  .smon-grid div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .smon-grid .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
        color:var(--muted-dim)}
  .smon-grid .v{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .smon-srv{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);
        display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px}
  .smon-srv .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
        color:var(--muted-dim);display:block}
  .smon-srv .v{font-family:var(--mono);font-size:11px;color:var(--muted)}

  /* T-code checklist. Compact grid so 14 counters fit without scrolling,
     sorted worst-first so the eye lands on a problem immediately. */
  .checks{padding:11px 16px;border-top:1px solid var(--border)}
  .checks-head{display:flex;justify-content:space-between;font-size:10px;font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:8px}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:1px;
        background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  /* The metric name leads; the transaction code is provenance, not the
     headline. The previous layout reserved 38px for the T-code and let the
     label ellipsis away to "Lo..." -- which told a viewer nothing about what
     375 was counting. */
  .chk{background:var(--card);padding:7px 9px;display:flex;align-items:center;
        justify-content:space-between;gap:9px;min-width:0}
  .chk .txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .chk .lb{font-size:11px;color:var(--muted);overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
  .chk .tc{font-family:var(--mono);font-size:9px;font-weight:700;
        letter-spacing:.04em;color:var(--muted-dim)}
  .chk .vl{font-family:var(--mono);font-size:12px;font-weight:800;white-space:nowrap}
  .chk.s-critical{background:var(--red-bg)}
  .chk.s-warning{background:var(--amber-bg)}
  .chk.s-unknown .vl{color:var(--muted-dim);font-style:italic;font-weight:600;font-size:10.5px}
  .chk.s-critical .vl{color:var(--red)}
  .chk.s-warning .vl{color:var(--amber)}
  .chk.s-normal .vl{color:var(--green)}

  .inst{padding:11px 16px;border-top:1px solid var(--border)}
  .inst table{font-size:11.5px}
  .inst th,.inst td{padding:6px 8px}

  .err{padding:13px 16px;font-size:11.5px;font-family:var(--mono);color:var(--red);
       border-top:1px solid var(--border);white-space:pre-wrap;max-height:110px;overflow:auto}
  .foot{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--border);
        font-size:10.5px;color:var(--muted-dim);font-family:var(--mono)}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h2>Live operations wall</h2>
      <div class="sub">Direct RFC reads · <span id="every">manual</span> — click Read live to refresh</div>
    </div>
    <div class="top-actions">
      <span id="sched-ctl" style="display:flex;gap:8px;align-items:center"></span>
      <span class="chip c-live"><span class="pulse"></span> <span id="livecount">–</span> live</span>
      <button class="btn btn-primary" id="readlive">↻ Read live</button>
      <select class="input" id="rate" title="Auto-refresh interval (manual = only when Read live is clicked)">
        <option value="0" selected>manual</option>
        <option value="10000">every 10s</option>
        <option value="30000">every 30s</option>
        <option value="60000">every 60s</option>
      </select>
      <span id="run-ctl"></span>
      <button class="btn" id="theme">◑ Light</button>
    </div>
  </div>

  <div class="content">
    <div id="banner"></div>
    <div class="wall" id="wall"><div class="ibo-loading-inline"><img src="/static/brand/ibops-mark-64.png" alt=""><span>Reading live RFC…</span></div></div>
    <div style="margin-top:14px;font-size:11px;color:var(--muted-dim)">
      Last read <span id="gen" class="mono">–</span>. Values marked
      <span class="src src-rfc">RFC LIVE</span> come straight from the application
      server. Values marked <span class="src src-gui">SAP GUI</span> or
      <span class="src src-stale">stale</span> come from the last monitoring sweep
      on the dedicated collector machine.
    </div>
  </div>
</main>

<script src="/static/shell.js?v=ds4"></script>
<script>
/* Every page here depends on shell.js for the sidebar, theme and helpers.
   If it fails to load the page renders bare with only a console error, which
   looks like the app is broken rather than one asset being missing. Say so
   on screen instead. */
if (typeof IB === "undefined") {
  document.body.innerHTML =
    '<div style="font-family:system-ui;padding:40px;max-width:640px;margin:0 auto">' +
    '<h2 style="margin-bottom:10px">Shared assets did not load</h2>' +
    '<p style="color:#666;line-height:1.6">This page needs ' +
    '<code>/static/shell.js?v=ds4</code> and <code>/static/shell.css?v=ds4</code>. ' +
    'They are missing or the static mount is not serving them.</p>' +
    '<p style="color:#666;line-height:1.6">Check that ' +
    '<code>dashboard/static/shell.js?v=ds4</code> exists, then restart the server. ' +
    'If you are seeing this inside a preview pane rather than at ' +
    '<code>127.0.0.1:8000</code>, that is expected — there is no server ' +
    'behind a preview.</p></div>';
}
</script>
<script>
IB.mountShell("wall");
IB.mountSchedulerControl("sched-ctl");
IB.mountRunControl("run-ctl");
IB.themeToggle(document.getElementById("theme"));

let timer = null;

function tile(label, value, status, meta) {
  const st = String(status || "unknown").toLowerCase();
  return `<div class="t">
      <div class="k">${IB.esc(label)}</div>
      <div class="v v-${st}">${value}</div>
      ${meta ? `<div class="m">${meta}</div>` : ""}
    </div>`;
}

/* A tile filled from the last sweep rather than the live RFC read must say
   so. Showing a 45-minute-old value under an "RFC LIVE" badge would be a
   quiet lie. */
function srcNote(s, field) {
  const f = (s.fallback_sources || {})[field];
  if (!f) return "";
  const age = (f.age_minutes !== null && f.age_minutes !== undefined)
    ? ` · ${f.age_minutes}m old` : "";
  return `${IB.esc(f.source)}${age}`;
}

function gradeCpu(v)  { if (v === null) return "unknown"; return v >= 90 ? "critical" : v >= 80 ? "warning" : "normal"; }
function gradeWp(v)   { if (v === null) return "unknown"; return v >= 90 ? "critical" : v >= 75 ? "warning" : "normal"; }

function overall(s) {
  if (!s.connected) return "unknown";
  const g = [gradeCpu(s.cpu), gradeCpu(s.memory),
             gradeWp(s.work_processes && s.work_processes.utilization_pct)];
  // The T-code counters carry the same weight as the OS tiles: 7 ABAP dumps
  // matters more than CPU at 40%, and a card that ignored them would be
  // green while the system was failing transactions.
  for (const c of (s.checks || [])) {
    if (c.status === "CRITICAL") g.push("critical");
    else if (c.status === "WARNING") g.push("warning");
  }
  if (g.includes("critical")) return "critical";
  if (g.includes("warning")) return "warning";
  return "normal";
}

function checks(list, source, err) {
  if (err) {
    return `<div class="checks"><div class="checks-head"><span>T-code checks</span>
            <span>error</span></div>
            <div class="no-data">${IB.esc(err)}</div></div>`;
  }
  if (!list || !list.length) {
    return `<div class="checks"><div class="checks-head"><span>T-code checks</span>
            <span>no data</span></div>
            <div class="no-data">No counters returned — the system is not reachable,
            or Z_GET_OBSERVABILITY_DATA is not installed and the fallback queries
            found nothing.</div></div>`;
  }
  const bad = list.filter(c => c.status === "CRITICAL" || c.status === "WARNING").length;
  return `<div class="checks">
      <div class="checks-head">
        <span>T-code checks · ${IB.esc(source || "RFC")}</span>
        <span class="mono">${bad ? bad + " need attention" : "all within threshold"}
              · ${list.length} checks</span>
      </div>
      <div class="check-grid">
        ${list.map(c => `<div class="chk s-${c.status.toLowerCase()}"
             title="${IB.esc(c.metric)}${c.detail ? " — " + IB.esc(c.detail) : ""}">
            <span class="txt">
              <span class="lb">${IB.esc(c.label)}</span>
              <span class="tc">${IB.esc(c.tcode)}</span>
            </span>
            <span class="vl">${IB.esc(c.value)}</span>
          </div>`).join("")}
      </div>
    </div>`;
}

function smonPanel(sm) {
  if (!sm || sm.cpu === undefined && sm.dialog_queue === undefined) return "";
  if (!Object.keys(sm).length) return "";
  const cell = (k, v, suffix) =>
    (v === null || v === undefined) ? "" :
    `<div><span class="k">${k}</span><span class="v">${IB.esc(String(v))}${suffix || ""}</span></div>`;
  const cells = [
    cell("Dialog queue", sm.dialog_queue),
    cell("Update queue", sm.update_queue),
    cell("Sessions", sm.sessions),
    cell("Users", sm.users),
    cell("Free RAM", sm.free_mem_mb, " MB"),
    cell("Free incl. cache", sm.free_mem_mb_inc_fs, " MB"),
    cell("RAM excl. cache", sm.memory_excl_cache, "%"),
    cell("CPU idle", sm.cpu_idle_raw, "%"),
    cell("Instances", sm.instance_count),
    cell("Dialog avg 60s", sm.dialog_avg_60s),
    cell("DB round-trip", sm.db_rtt_ms, " ms"),
    cell("CPUs", sm.cpus),
  ].join("");
  if (!cells) return "";
  // Per-instance breakdown. Aggregate totals hide the case where one app
  // server is saturated and the other is idle -- which averages to "fine".
  let perServer = "";
  if (sm.per_server && sm.per_server.length > 1) {
    perServer = `<div class="smon-srv">` + sm.per_server.map(p =>
      `<div><span class="k">${IB.esc(p.server)}</span><span class="v">` +
      [p.cpu === null ? "cpu –" : `cpu ${p.cpu}%`,
       p.free_mem_mb === null ? "" : `free ${p.free_mem_mb} MB`,
       p.sessions === null ? "" : `${p.sessions} sess`]
        .filter(Boolean).join(" · ") + `</span></div>`).join("") + `</div>`;
  }

  const head = sm.instance_count > 1
    ? `${sm.instance_count} instances · ${IB.esc(sm.server || "")}`
    : IB.esc(sm.server || "");

  return `<div class="smon">
      <div class="smon-head">
        <span>Workload · SMON</span>
        <span class="mono">${head}${sm.sample_time ? " · " + IB.esc(sm.sample_time) : ""}</span>
      </div>
      <div class="smon-grid">${cells}</div>
      ${perServer}
    </div>`;
}

function workProcesses(wp) {
  if (!wp || !wp.available) {
    return `<div class="wp"><div class="wp-head"><span>Work processes</span>
            <span>no data</span></div>
            <div class="no-data">TH_WPINFO returned nothing for this system.</div></div>`;
  }
  const pct = wp.utilization_pct;
  const types = Object.entries(wp.by_type || {}).map(([k, v]) =>
    `<span>${IB.esc(k)} <b>${v.in_use}/${v.total}</b></span>`).join("");
  // A blank WP_USER used to render as the literal word "system" next to the
  // program name, which read as a username. Show whichever fields exist.
  const lrParts = [];
  if (wp.longest_running) {
    lrParts.push(`WP ${IB.esc(wp.longest_running.wp)}`);
    lrParts.push(`${Math.round(wp.longest_running.seconds / 60)}m`);
    if (wp.longest_running.user) lrParts.push(IB.esc(wp.longest_running.user));
    if (wp.longest_running.report) lrParts.push(IB.esc(wp.longest_running.report));
  }
  const lr = wp.longest_running
    ? `<div class="longest">Longest running: ${lrParts.join(" · ")}</div>` : "";

  return `<div class="wp">
      <div class="wp-head">
        <span>Work processes</span>
        <span class="mono">${wp.in_use} in use / ${wp.total} total · ${wp.free} free</span>
      </div>
      <div class="bar"><i class="${IB.barClass(pct)}" style="width:${pct || 0}%"></i></div>
      <div class="wp-types">${types}</div>
      ${lr}
    </div>`;
}

function instances(list) {
  if (!list || !list.length) return "";

  // SERVICES came from TH_SERVER_LIST and was empty on every system seen so
  // far, so the column carried no information. Replaced with the per-instance
  // response time -- which is what SMLG's own instance view shows and what
  // the table is actually opened to find out.
  //
  // The separate logon-group table is gone with it. Five groups all reading
  // "not measured" told the reader nothing except that groups exist; the
  // per-instance figure is the same data in the form people use.

  const cell = (i) => {
    if (i.response_ms === null || i.response_ms === undefined) {
      // STAT was readable and empty: the instance is idle, which is a
      // measurement, not a gap. Say that instead of "not measured".
      if (i.response_note) {
        return `<span style="color:var(--muted)" title="${IB.esc(i.response_note)}">idle</span>` +
               `<div style="font-size:9.5px;color:var(--muted-dim)">no dialog steps in window</div>`;
      }
      // Never render an unmeasured instance as 0 ms -- an instance nothing has
      // measured is not a fast instance. The tooltip names what would make it
      // measurable, so "not measured" is a next step rather than a dead end.
      // Changed on request (16 Sep 2026): show "idle" here too rather than
      // "not measured". This branch used to mean "no source could ever
      // measure this instance" as distinct from the response_note branch
      // above ("a source measured it and found nothing") -- but from the
      // wall the two look identical, and the distinction was getting lost
      // whenever a backend edge case produced this branch instead of the
      // other one. The full explanation stays in the tooltip.
      return '<span style="color:var(--muted-dim)" title="No RFC source has ' +
             'a response time for this instance. RZLLITAB only measures users ' +
             'who connect via a logon group; ST03 workload needs stat/level ' +
             'enabled in RZ11; the STAT read found no dialog steps.">idle</span>';
    }
    const ms = i.response_ms;
    // A sparse-sample or daily-aggregate STAT figure is informational, not a
    // verdict: render it muted with the reason, never red.
    const lowConf = !!i.response_low_confidence;
    const colour = lowConf ? "var(--muted)"
                 : ms >= 1000 ? "var(--red)" : ms >= 400 ? "var(--amber)" : "var(--green)";
    // A raw "470596 ms" is unreadable and invites the reader to assume a unit
    // bug. Past a second, show seconds; past a minute, minutes and seconds.
    // The exact millisecond figure stays in the tooltip.
    const human = ms >= 60000
      ? `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`
      : ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.round(ms)} ms`;
    const stat = i.response_statistic || "median";
    const note = lowConf && i.response_confidence_note ? i.response_confidence_note : "";
    return `<span style="color:${colour}" title="${IB.esc(String(Math.round(ms)))} ms · ` +
           `${IB.esc(stat)} per dialog step · ${IB.esc(i.response_source || "")}` +
           `${note ? " · " + IB.esc(note) : ""}">` +
           `${IB.esc(human)}</span>` +
           `<div style="font-size:9.5px;color:var(--muted-dim)">${IB.esc(stat)}` +
           (i.response_source ? ` · ${IB.esc(i.response_source)}` : "") +
           (note ? `<br><span style="color:var(--amber)">${IB.esc(note)}</span>` : "") +
           `</div>`;
  };

  return `<div class="inst">
      <table>
        <tr><th>Instance</th><th>Host</th><th>Response</th><th>Users</th><th>State</th></tr>
        ${list.map(i => `<tr>
          <td class="mono">${IB.esc(i.name)}</td>
          <td class="mono">${IB.esc(i.host || "—")}</td>
          <td class="mono">${cell(i)}</td>
          <td class="mono">${i.users === null || i.users === undefined
              ? "—" : IB.esc(String(i.users))}</td>
          <td><span class="chip c-live">${IB.esc(i.state)}</span></td>
        </tr>`).join("")}
      </table>
    </div>`;
}

function card(s) {
  // Defensive defaults. A warming-up or partial payload may be missing whole
  // sub-objects; one unguarded s.dispatcher.label used to throw here, which
  // took down the entire .map(card) and left the wall stuck on the loader.
  const disp = s.dispatcher || { label: "…", status: "UNKNOWN", source: "" };
  const icm = s.icm || { label: "…", status: "UNKNOWN", source: "" };
  const st = overall(s);
  const wp = s.work_processes || {};
  const wpPct = wp.available ? wp.utilization_pct : null;

  const err = s.error
    ? `<div class="err">${IB.esc(String(s.error).split("\n").slice(0, 4).join("\n"))}${
        s.cooldown ? `\n\nRetrying in ${s.cooldown}s.` : ""}</div>`
    : "";

  return `<div class="sys s-${st} ${st === "unknown" ? "unknown-fill" : ""}">
    <div class="sh">
      <div>
        <h3>${IB.esc(s.system)}</h3>
        <div class="sid">${IB.esc(s.sid || "")} · client ${IB.esc(s.client || "—")}
          ${s.db_type ? "· " + IB.esc(s.db_type) : ""}</div>
      </div>
      <div class="right">
        ${s.connected ? '<span class="src src-rfc">RFC LIVE</span>'
                      : '<span class="src src-none">no connection</span>'}
        <span class="chip ${IB.statusClass(st)}">${st.toUpperCase()}</span>
      </div>
    </div>

    <div class="tiles">
      ${tile("CPU", IB.val(s.cpu, "%", 0), gradeCpu(s.cpu), srcNote(s, "cpu"))}
      ${/* Memory: show the percentage when one can be derived, labelled with
            its basis so a cache-inclusive 99% is never mistaken for pressure.
            Where no percentage exists but a free figure was read, show the
            free figure rather than "No data". */""}
      ${(() => {
        const basis = (s.smon && s.smon.memory_basis) || null;
        const freeStr = s.ccms && s.ccms.mem_free_display;
        if (s.memory !== null && s.memory !== undefined) {
          const label = s.memory_is_sap_internal ? "SAP memory" : "Memory";
          return tile(label, IB.val(s.memory, "%", 0), gradeCpu(s.memory),
                      basis ? basis : srcNote(s, "memory"));
        }
        if (freeStr) {
          // No denominator, but a real free figure. Show it, grade neutral --
          // free memory without a total cannot be graded, only reported.
          return tile("Memory free", IB.esc(freeStr), "normal",
                      "RFC · CCMS RZ20 · no total published");
        }
        return tile("Memory", IB.val(null), "unknown",
                    s.ccms && s.ccms.memory_note ? IB.esc(s.ccms.memory_note)
                                                 : srcNote(s, "memory"));
      })()}
      ${tile("Dispatcher", IB.esc(disp.label), (disp.status || "unknown").toLowerCase(),
             disp.source ? IB.esc(disp.source) : "")}
      ${tile("ICM", IB.esc(icm.label), (icm.status || "unknown").toLowerCase(),
             icm.source ? IB.esc(icm.source) : "")}
      ${/* Uptime, not wall clock. Shows how long since this instance last
            (re)started -- the operational number. Falls back to the SAP
            system clock only where the kernel start time is unreadable. */""}
      ${s.uptime_text
        ? tile("Uptime", IB.esc(s.uptime_text),
               (s.uptime_seconds !== undefined && s.uptime_seconds < 1800 && !s.uptime_bounded)
                 ? "warning" : "normal",
               (s.last_downtime_text
                  ? "last down: " + IB.esc(s.last_downtime_text)
                    + (s.last_down_from ? " (" + IB.esc(s.last_down_from) + ")" : "")
                  : (s.uptime_since ? "since " + IB.esc(s.uptime_since) : ""))
               + (s.uptime_source ? " · " + IB.esc(s.uptime_source) : ""))
        : tile("Server time", IB.val(s.server_time), s.server_time ? "normal" : "unknown",
               s.server_time_source ? IB.esc(s.server_time_source) : "")}
    </div>

    ${workProcesses(wp)}
    ${instances(s.instances)}

    <div style="text-align:center;margin:6px 0">
      <button class="btn" style="font-size:11px;padding:3px 14px"
              id="moreBtn-${IB.esc(s.system)}"
              onclick="toggleMore('${IB.esc(s.system)}')">More</button>
    </div>
    <div id="morePanel-${IB.esc(s.system)}" style="display:none">
      ${checks(s.checks, s.check_source, s.check_error)}
    </div>
    ${err}

    <div class="foot">
      <span>read ${IB.esc(s.read_at || "–")}</span>
      ${s.cache_age_seconds ? `<span>cache ${s.cache_age_seconds}s</span>` : ""}
      ${s.snapshot_age_minutes !== undefined && s.snapshot_age_minutes !== null
        ? `<span>last sweep ${s.snapshot_age_minutes}m ago</span>` : ""}
      <button class="btn" style="margin-left:auto;padding:4px 11px;font-size:11px"
              onclick="refreshOne('${IB.esc(s.system)}')"
              id="refresh-${IB.esc(s.system)}" title="Fresh RFC read for this system only">↻ Refresh</button>
      <button class="btn btn-primary" style="padding:4px 11px;font-size:11px"
              onclick="monitorOne('${IB.esc(s.system)}')"
              id="run-${IB.esc(s.system)}">Monitor this system</button>
      <a href="/system?name=${encodeURIComponent(s.system)}"
         style="color:var(--brand-live);font-weight:700">Detail →</a>
    </div>
  </div>`;
}

/* Fresh RFC read for one system only. No SAP GUI, no sweep -- just an
   on-demand read of RFC counters + TH_WPINFO for the one card the user is
   looking at. Bypasses the wall-wide cooldown so a dead host does not block
   a live one, and re-renders in place instead of forcing a full wall reload.
   The whole call takes ~1s for a healthy system, ~10s for a dead one (TCP
   probe timeout). */
const _moreOpen = new Set();

function toggleMore(name) {
  const panel = document.getElementById("morePanel-" + name);
  const btn = document.getElementById("moreBtn-" + name);
  if (!panel) return;
  const opening = panel.style.display === "none";
  panel.style.display = opening ? "" : "none";
  if (btn) btn.textContent = opening ? "Less" : "More";
  if (opening) { _moreOpen.add(name); } else { _moreOpen.delete(name); }
}

function restoreMoreState() {
  _moreOpen.forEach(function(name) {
    const panel = document.getElementById("morePanel-" + name);
    const btn = document.getElementById("moreBtn-" + name);
    if (panel) panel.style.display = "";
    if (btn) btn.textContent = "Less";
  });
}

async function refreshOne(name) {
  const btn = document.getElementById("refresh-" + name);
  if (btn) { btn.disabled = true; btn.textContent = "↻ Reading…"; }
  try {
    const r = await fetch("/api/live/" + encodeURIComponent(name)
                          + "?fresh=1&_t=" + Date.now());
    if (r.ok) {
      await load();   // re-render the whole wall from cache; the one system
                      // that just refreshed will have new numbers, everyone
                      // else keeps whatever they had.
    }
  } catch (e) { /* button gets re-enabled below */ }
  const b2 = document.getElementById("refresh-" + name);
  if (b2) { b2.disabled = false; b2.textContent = "↻ Refresh"; }
}

/* Monitor ONE system. A full sweep drives SAP GUI for every system and
   takes minutes; re-checking the one you are looking at should not. */
async function monitorOne(name) {
  const btn = document.getElementById("run-" + name);
  if (btn) { btn.disabled = true; btn.textContent = "Monitoring…"; }
  try {
    const r = await IB.post("/api/run-now/" + encodeURIComponent(name));
    if (r.status === 409) {
      const d = await r.json();
      if (btn) { btn.disabled = false; btn.textContent = "Busy — try again"; }
      alert(d.detail || "A run is already in progress.");
      return;
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Monitor this system"; }
    return;
  }
  pollRun(name);
}

async function pollRun(name) {
  const btn = document.getElementById("run-" + name);
  try {
    const s = await IB.get("/api/run-status");
    if (s.running) {
      if (btn) btn.textContent = `Monitoring ${s.current_system || ""}…`;
      return setTimeout(() => pollRun(name), 2000);
    }
  } catch (e) {}
  if (btn) { btn.disabled = false; btn.textContent = "Monitor this system"; }
  load();
}

// One card's render failure must never blank the whole wall. If card() throws
// on an unexpected payload, show that system as a broken tile and keep every
// other system on screen -- the opposite of the all-or-nothing .map that left
// the wall stuck on the loader.
function safeCard(s) {
  try {
    return card(s);
  } catch (e) {
    const name = (s && s.system) ? IB.esc(s.system) : "unknown";
    return `<div class="sys s-unknown unknown-fill">
      <div class="sh"><div><h3>${name}</h3>
      <div class="sid">render error</div></div></div>
      <div class="err">This card could not be drawn: ${IB.esc(e.message)}.
      The other systems are unaffected.</div></div>`;
  }
}

async function load() {
  try {
    const d = await IB.get("/api/live");
    IB.heartbeat.beat({ live: d.live_count, total: d.total,
      critical: (d.systems || []).some(x => (x.checks || []).some(c => c.status === "CRITICAL")) });
    document.getElementById("wall").innerHTML =
      d.systems.length ? d.systems.map(safeCard).join("")
                       : '<div class="empty">No systems configured.</div>';
    restoreMoreState();
    document.getElementById("livecount").textContent = `${d.live_count}/${d.total}`;
    document.getElementById("gen").textContent = d.generated_at;

    const down = d.systems.filter(s => !s.connected);
    document.getElementById("banner").innerHTML = down.length
      ? `<div class="banner banner-warn"><strong>${down.length} system(s) not reachable over RFC:</strong>
         ${down.map(s => IB.esc(s.system)).join(", ")} — shown as UNKNOWN, not healthy.</div>`
      : "";
  } catch (e) {
    document.getElementById("banner").innerHTML =
      `<div class="banner banner-err">Could not reach /api/live — ${IB.esc(e.message)}</div>`;
  }
}

function schedule() {
  if (timer) timer.stop && timer.stop();
  const ms = Number(document.getElementById("rate").value);
  const everyEl = document.getElementById("every");
  if (everyEl) everyEl.textContent = ms ? ms / 1000 : "manual";
  if (ms) timer = IB.poll(load, ms);
}
document.getElementById("rate").onchange = schedule;

// Read live: trigger an on-demand read of every system, then poll /api/live
// while it runs so cards fill in as each system lands. This is the manual
// replacement for the old always-on timer -- nothing reads SAP until this
// is clicked.
const readBtn = document.getElementById("readlive");
let readPoll = null;

async function readLive() {
  readBtn.disabled = true;
  readBtn.textContent = "↻ Reading…";
  try {
    const r = await IB.post("/api/live/refresh", { label: "Reading all systems…" });
    const body = await r.json().catch(() => ({}));
    if (body.started === false && body.reason === "already_running") {
      // A read is already in flight (e.g. double click) -- just watch it.
    }
    // Poll the wall data AND the job status until the pass completes.
    if (readPoll) readPoll.stop && readPoll.stop();
    readPoll = IB.poll(async () => {
      await load();
      let st = {};
      try { st = await IB.get("/api/live/refresh/status"); } catch (e) {}
      if (st && st.total) {
        readBtn.textContent = st.in_progress
          ? `↻ Reading ${st.done}/${st.total}…` : "↻ Read live";
      }
      if (st && !st.in_progress) {
        if (readPoll) { readPoll.stop && readPoll.stop(); readPoll = null; }
        readBtn.disabled = false;
        readBtn.textContent = "↻ Read live";
      }
    }, 1500);
  } catch (e) {
    readBtn.disabled = false;
    readBtn.textContent = "↻ Read live";
    document.getElementById("banner").innerHTML =
      `<div class="banner banner-err">Could not start read — ${IB.esc(e.message)}</div>`;
  }
}
readBtn.onclick = readLive;

// On first open: show whatever is already cached (instant, may be empty),
// then kick one read automatically so the operator sees data without a
// second click. Auto-refresh stays off unless they pick an interval.
//
// Any exception in this boot sequence used to leave the page stuck on the
// "Reading live RFC…" placeholder with no clue why. Paint it on screen.
function bootError(where, e) {
  const msg = (e && e.stack) ? e.stack : String(e);
  document.getElementById("wall").innerHTML =
    `<div class="banner banner-err"><strong>Page failed to start (${IB.esc(where)}):</strong>
     <pre style="white-space:pre-wrap;margin:6px 0 0">${IB.esc(msg)}</pre></div>`;
  console.error("wall boot error in", where, e);
}
window.addEventListener("error", ev => bootError("window", ev.error || ev.message));
window.addEventListener("unhandledrejection", ev => bootError("promise", ev.reason));

(async () => {
  try { await load(); } catch (e) { bootError("load", e); return; }
  try { await readLive(); } catch (e) { bootError("readLive", e); }
  try { schedule(); } catch (e) { bootError("schedule", e); }
})();
</script>
</body>
</html>
