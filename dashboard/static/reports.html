<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraBeatOps · Health Reports</title>
<link rel="icon" href="/static/brand/favicon.png">
<script>(function(){var t=null;try{t=localStorage.getItem("ibo-theme");}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
<link rel="stylesheet" href="/static/shell.css?v=ds4">
<style>
  .split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
  .syslist .item{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;
       display:flex;align-items:center;gap:9px}
  .syslist .item:last-child{border-bottom:none}
  .syslist .item:hover{background:var(--card-hover)}
  .syslist .item.on{background:rgba(0,102,179,.14);color:var(--brand-live)}
  .syslist .item b{font-size:13px}
  .summary{font-size:14.5px;line-height:1.65;padding:16px;border-radius:var(--radius);
       background:var(--info-bg);border:1px solid var(--info-br)}
  .finding{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:13px;
       overflow:hidden;background:var(--card)}
  .finding.critical{border-left:3px solid var(--red)}
  .finding.warning{border-left:3px solid var(--amber)}
  .fh{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border)}
  .fh h4{font-size:13.5px;font-weight:800;flex:1}
  .fb{padding:13px 15px}
  .fb .why{color:var(--muted);margin-bottom:12px;line-height:1.55;font-size:12.5px}
  .fb h5{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       color:var(--muted-dim);margin:12px 0 6px}
  .fb ol,.fb ul{margin-left:17px;font-size:12.5px;line-height:1.7}
  .fb li{margin-bottom:3px}
  .missing li{color:var(--amber)}
  .ev li{color:var(--muted);font-family:var(--mono);font-size:11.5px}
  .culprit{background:var(--info-bg);border:1px solid var(--info-br);
       border-radius:var(--radius);padding:11px 13px;margin-bottom:4px}
  .culprit b{font-size:13.5px}
  .culprit .cstate{font-size:12.5px;line-height:1.55;margin-top:4px;color:var(--muted)}
  .culprit .clabel{font-size:9.5px;font-weight:700;letter-spacing:.05em;
       text-transform:uppercase;color:var(--muted-dim);margin:10px 0 4px}
  .culprit .cconf{margin-left:16px;font-size:12px;line-height:1.6;color:var(--muted)}
  .culprit .cwarn{margin-top:9px;padding:8px 10px;border-radius:5px;
       background:rgba(200,150,0,.10);color:var(--amber);font-size:12px;line-height:1.55}
  .params li{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .ruleid{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--muted-dim);
       text-transform:none;letter-spacing:0}
  .btn.primary{background:var(--brand-live);color:#fff;border-color:transparent}
  .srcnote{font-size:12px;color:var(--muted);background:var(--info-bg);
       border:1px solid var(--info-br);border-radius:var(--radius);
       padding:10px 13px;margin-bottom:13px;line-height:1.55}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div><h2>Health reports</h2>
      <div class="sub">Findings, solutions and summary from the last monitoring sweep</div></div>
    <div class="top-actions">
      <span id="sched-ctl" style="display:flex;gap:8px;align-items:center"></span>
      <button class="btn primary" id="live-btn">Read live over RFC</button>
      <button class="btn" onclick="window.print()">Print</button>
      <button class="btn" id="theme">◑ Light</button>
    </div>
  </div>
  <div class="content">
    <div class="split">
      <div class="card syslist" id="list"><div class="ibo-loading-inline"><img src="/static/brand/ibops-mark-64.png" alt=""><span>Loading reports…</span></div></div>
      <div id="report"><div class="card"><div class="empty">Select a system.</div></div></div>
    </div>
  </div>
</main>

<script src="/static/shell.js?v=ds4"></script>
<script>
/* Every page here depends on shell.js for the sidebar, theme and helpers.
   If it fails to load the page renders bare with only a console error, which
   looks like the app is broken rather than one asset being missing. Say so
   on screen instead. */
if (typeof IB === "undefined") {
  document.body.innerHTML =
    '<div style="font-family:system-ui;padding:40px;max-width:640px;margin:0 auto">' +
    '<h2 style="margin-bottom:10px">Shared assets did not load</h2>' +
    '<p style="color:#666;line-height:1.6">This page needs ' +
    '<code>/static/shell.js?v=ds4</code> and <code>/static/shell.css?v=ds4</code>. ' +
    'They are missing or the static mount is not serving them.</p>' +
    '<p style="color:#666;line-height:1.6">Check that ' +
    '<code>dashboard/static/shell.js?v=ds4</code> exists, then restart the server. ' +
    'If you are seeing this inside a preview pane rather than at ' +
    '<code>127.0.0.1:8000</code>, that is expected — there is no server ' +
    'behind a preview.</p></div>';
}
</script>
<script>
IB.mountShell("reports");
IB.mountSchedulerControl("sched-ctl");
IB.themeToggle(document.getElementById("theme"));
let SYSTEMS = [];

function renderList(active) {
  document.getElementById("list").innerHTML = SYSTEMS.map(s => `
    <div class="item ${s.name === active ? "on" : ""}" onclick="show('${IB.esc(s.name)}')">
      <span class="chip ${IB.statusClass(s.status)}">${IB.esc((s.status||"?")[0])}</span>
      <b>${IB.esc(s.name)}</b>
    </div>`).join("");
}

function finding(f) {
  return `<div class="finding ${f.severity.toLowerCase()}">
    <div class="fh">
      <span class="chip ${IB.statusClass(f.severity)}">${IB.esc(f.severity)}</span>
      <h4>${IB.esc(f.tcode)} · ${IB.esc(f.observation)}</h4>
      <span class="src src-none">confidence ${IB.esc(f.confidence)}</span>
    </div>
    <div class="fb">
      <div class="why">${IB.esc(f.why_it_matters)}</div>

      ${f.culprit && f.culprit.component ? `
        <h5>Likely culprit</h5>
        <div class="culprit">
          <b>${IB.esc(f.culprit.component)}</b>
          <div class="cstate">${IB.esc(f.culprit.statement || "")}</div>
          ${(f.culprit.confirm_in || []).length ? `
            <div class="clabel">Confirm before acting</div>
            <ul class="cconf">${f.culprit.confirm_in.map(c => `<li>${IB.esc(c)}</li>`).join("")}</ul>` : ""}
          ${f.culprit.confirm_notes
            ? `<div class="cwarn">${IB.esc(f.culprit.confirm_notes)}</div>` : ""}
        </div>` : ""}

      ${(f.parameters || []).length ? `
        <h5>SAP parameters that govern this</h5>
        <ul class="params">${f.parameters.map(p => `<li>${IB.esc(p)}</li>`).join("")}</ul>` : ""}

      <h5>Recommended actions${f.rule_id
        ? ` <span class="ruleid">from ${IB.esc(f.rule_id)}</span>` : ""}</h5>
      <ol>${f.solutions.map(s => `<li>${IB.esc(s)}</li>`).join("")}</ol>
      <h5>Evidence</h5>
      <ul class="ev">${f.evidence.map(e => `<li>${IB.esc(e)}</li>`).join("")}</ul>
      ${f.missing_evidence.length ? `<h5>Evidence not available</h5>
        <ul class="missing">${f.missing_evidence.map(e => `<li>${IB.esc(e)}</li>`).join("")}</ul>` : ""}
    </div>
  </div>`;
}

let LIVE = false;
let CURRENT = null;

async function show(name, live) {
  CURRENT = name;
  if (live !== undefined) LIVE = live;
  renderList(name);
  const el = document.getElementById("report");
  el.innerHTML = `<div class="card"><div class="empty">${
    LIVE ? "Reading " + IB.esc(name) + " over RFC…"
         : "Building report for " + IB.esc(name) + "…"}</div></div>`;
  try {
    const r = await IB.get("/api/report/" + encodeURIComponent(name)
                           + (LIVE ? "?live=true" : ""));
    const c = r.counts;

    // Say which path produced this. A live report is genuinely thinner than a
    // swept one -- no screenshots, no OCR, no SSH metrics -- and a reader who
    // does not know that will read fewer findings as better health.
    const srcNote = r.source === "live_rfc"
      ? `<div class="srcnote"><b>Live RFC read</b>${r.read_at ? " at " + IB.esc(r.read_at) : ""}.
          ${IB.esc(r.note || "")}</div>`
      : "";

    el.innerHTML = srcNote + `
      <div class="grid g4" style="margin-bottom:15px">
        <div class="kpi"><div class="lbl">Health score</div>
          <div class="num ${r.health_score>=80?'n-green':r.health_score>=50?'n-amber':'n-red'}">${r.health_score}</div>
          <div class="sub">deducted for breaches and blind spots</div></div>
        <div class="kpi"><div class="lbl">Critical</div><div class="num n-red">${c.critical}</div></div>
        <div class="kpi"><div class="lbl">Warning</div><div class="num n-amber">${c.warning}</div></div>
        <div class="kpi"><div class="lbl">Not collected</div><div class="num n-gray">${c.uncollected}</div>
          <div class="sub">state unknown</div></div>
      </div>

      <div class="summary" style="margin-bottom:16px">
        ${IB.esc(r.summary)}
        <div style="margin-top:9px;font-size:11px;color:var(--muted-dim)">
          Summary written by ${r.summary_source === "llm" ? "the AI layer from the findings below"
            : "deterministic rules (AI disabled or unavailable)"} ·
          sweep ${IB.esc(r.cycle_timestamp)}
        </div>
      </div>

      ${r.findings.length
        ? `<h3 style="font-size:13px;margin-bottom:10px">Findings (${r.findings.length})</h3>
           ${r.findings.map(finding).join("")}`
        : `<div class="card"><div class="empty">No threshold breaches in the checks that returned data.</div></div>`}

      ${r.uncollected.length ? `
        <div class="card" style="margin-top:15px">
          <div class="card-h"><h3>Not collected (${r.uncollected.length})</h3>
            <span class="src src-none">state unknown, not healthy</span></div>
          <table>
            <tr><th>T-Code</th><th>Metric</th><th>Reason</th></tr>
            ${r.uncollected.map(u => `<tr><td class="mono">${IB.esc(u.tcode)}</td>
              <td class="mono">${IB.esc(u.metric)}</td>
              <td style="color:var(--muted-dim)">${IB.esc(u.reason)}</td></tr>`).join("")}
          </table>
        </div>` : ""}`;
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="empty">
      No report available for ${IB.esc(name)}.<br><small>${IB.esc(e.message)}</small><br><br>
      ${LIVE
        ? `<small>The live path needs the system to answer over RFC.
             Check the connection error on the <a href="/wall">live wall</a>.</small>`
        : `<small>No sweep has completed for this system yet.<br>
             <button class="btn primary" onclick="show('${IB.esc(name)}', true)"
               style="margin-top:11px">Read live over RFC instead</button></small>`}
      </div></div>`;
  }
}

document.getElementById("live-btn").addEventListener("click", () => {
  // Explicit and per-click. The live path costs one RFC round trip per press;
  // it is not put on the refresh timer.
  if (CURRENT) show(CURRENT, true);
});

(async () => {
  const d = await IB.get("/api/overview");
  SYSTEMS = d.systems;
  IB.updatePathCounts(SYSTEMS);
  renderList(null);
  if (SYSTEMS.length) show(SYSTEMS[0].name);
})();
</script>
</body>
</html>
