<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraBeatOps · System Overview</title>
<link rel="icon" href="/static/brand/favicon.png">
<script>(function(){var t=null;try{t=localStorage.getItem("ibo-theme");}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
<link rel="stylesheet" href="/static/shell.css?v=ds4">
<style>
  /* ====================================================================
     InfraBeat palette. Light is default on this page (it is the daytime
     operations view); dark is the same tokens re-pointed.

     Status colours are NOT brand colours: if the alert red matches the
     logo red, operators stop reading it as an alarm. The light-mode
     greens and ambers are darkened from the brand values because
     #22C55E / #F59E0B fail WCAG AA on a white card.
     ==================================================================== */
  :root {
    --brand:#0066B3; --brand-hover:#0078D4; --brand-live:#008CC9;
    --bg:#F4F7FA; --sidebar:#FFFFFF; --card:#FFFFFF; --card-hover:#F7FAFC;
    --border:#D9E2EA; --text:#102A43; --muted:#526579; --muted-dim:#7A8CA0;
    --green:#15803D;  --green-bg:#ECFDF3;  --green-br:#ABEFC6;
    --amber:#B45309;  --amber-bg:#FFFAEB;  --amber-br:#FEDF89;
    --red:#B91C1C;    --red-bg:#FEF3F2;    --red-br:#FECDCA;
    --gray:#526579;   --gray-bg:#F2F4F7;   --gray-br:#E4E7EC;
    --info:#0369A1;   --automation:#7E22CE;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,42,67,.06);
    --shadow-h:0 4px 14px rgba(16,42,67,.10);
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  html[data-theme="dark"] {
    --bg:#08111C; --sidebar:#06101A; --card:#0D1B2A; --card-hover:#12283D;
    --border:#1B3449; --text:#F5F9FC; --muted:#A8B8C7; --muted-dim:#6F8293;
    --brand-live:#00A8E8;
    --green:#22C55E;  --green-bg:rgba(34,197,94,.10);  --green-br:rgba(34,197,94,.28);
    --amber:#F59E0B;  --amber-bg:rgba(245,158,11,.10); --amber-br:rgba(245,158,11,.28);
    --red:#EF4444;    --red-bg:rgba(239,68,68,.10);    --red-br:rgba(239,68,68,.28);
    --gray:#A8B8C7;   --gray-bg:rgba(111,130,147,.10); --gray-br:#1B3449;
    --info:#38BDF8;   --automation:#A855F7;
    --shadow:none; --shadow-h:0 4px 14px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
       font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
       font-size:14px;display:flex;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* ---------- sidebar ---------- */
  .sidebar{width:228px;background:var(--sidebar);border-right:1px solid var(--border);
           display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 22px}
  .brand .logo{width:32px;height:32px;border-radius:8px;flex-shrink:0;
       background:linear-gradient(135deg,var(--brand),var(--brand-hover));
       display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .brand h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .brand small{display:block;font-size:10px;color:var(--muted-dim);font-weight:600;
       letter-spacing:.04em;text-transform:uppercase}
  nav{padding:0 10px;flex:1;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
       color:var(--muted);font-weight:600;font-size:13px;margin-bottom:2px;cursor:pointer}
  .nav-item:hover{background:var(--card-hover);color:var(--text)}
  .nav-item.active{background:rgba(0,102,179,.09);color:var(--brand)}
  .nav-item .ico{width:16px;text-align:center;font-size:13px;opacity:.85}
  .nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
       font-weight:700;padding:1px 6px;border-radius:9px}
  .nav-item.soon{opacity:.45;cursor:default}
  .nav-item.soon:hover{background:none;color:var(--muted)}

  .collector-health{margin:10px;padding:13px;border:1px solid var(--border);
       border-radius:var(--radius);background:var(--card)}
  .ch-title{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       color:var(--muted-dim);margin-bottom:9px}
  .ch-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0}
  .ch-row span:last-child{font-family:var(--mono);font-weight:700}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;
       background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  .topbar h2{font-size:16px;font-weight:800}
  .topbar .sub{font-size:11.5px;color:var(--muted-dim)}
  .search{flex:1;max-width:400px;margin-left:20px;padding:8px 13px;border:1px solid var(--border);
       border-radius:8px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit}
  .search:focus{outline:2px solid var(--brand-live);outline-offset:1px;border-color:transparent}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
  .btn{padding:7px 13px;border:1px solid var(--border);background:var(--card);color:var(--text);
       border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit}
  .btn:hover{background:var(--card-hover)}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .content{padding:22px 24px 40px}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
       padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       color:var(--muted-dim);margin-bottom:7px}
  .kpi .num{font-size:27px;font-weight:800;line-height:1}
  .kpi .sub{font-size:11px;color:var(--muted-dim);margin-top:4px}
  .kpi.ok .num{color:var(--green)} .kpi.warn .num{color:var(--amber)}
  .kpi.crit .num{color:var(--red)} .kpi.unk .num{color:var(--gray)}

  .section-head{display:flex;align-items:baseline;gap:10px;margin:4px 0 13px}
  .section-head h3{font-size:14.5px;font-weight:800}
  .section-head .hint{font-size:11.5px;color:var(--muted-dim)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .sys{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
       overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .sys:hover{box-shadow:var(--shadow-h)}
  .sys.s-critical{border-top:3px solid var(--red)}
  .sys.s-warning{border-top:3px solid var(--amber)}
  .sys.s-normal{border-top:3px solid var(--green)}
  /* UNKNOWN is hatched so "we could not read this" never looks like a pass. */
  .sys.s-unknown{border-top:3px solid var(--gray);
       background-image:repeating-linear-gradient(135deg,transparent 0 8px,
       rgba(122,140,160,.05) 8px 16px)}

  .sys-head{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
  .sys-title{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .sys-title h4{font-size:15px;font-weight:800;flex:1;min-width:0;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       padding:3px 8px;border-radius:20px;white-space:nowrap}
  .c-normal{background:var(--green-bg);color:var(--green);border:1px solid var(--green-br)}
  .c-warning{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-br)}
  .c-critical{background:var(--red-bg);color:var(--red);border:1px solid var(--red-br)}
  .c-unknown{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-br)}
  .sys-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
       font-family:var(--mono);font-size:10.5px;color:var(--muted-dim)}
  .tag{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  .path{font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
  .p-RFC{color:var(--brand-live);background:rgba(0,140,201,.10);border:1px solid rgba(0,140,201,.25)}
  .p-SSH{color:var(--green);background:var(--green-bg);border:1px solid var(--green-br)}
  .p-GUI{color:var(--automation);background:rgba(126,34,206,.10);border:1px solid rgba(126,34,206,.22)}

  .counts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);
       border-bottom:1px solid var(--border)}
  .counts div{padding:10px 6px;text-align:center;border-right:1px solid var(--border)}
  .counts div:last-child{border-right:none}
  .counts .n{font-size:17px;font-weight:800;line-height:1.1}
  .counts .t{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       color:var(--muted-dim);margin-top:3px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);flex:1}
  .tile{background:var(--card);padding:10px 13px;min-height:52px}
  .tile .k{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       color:var(--muted-dim);margin-bottom:4px}
  .tile .v{font-size:13.5px;font-weight:700;font-family:var(--mono)}
  .v-normal{color:var(--green)} .v-warning{color:var(--amber)}
  .v-critical{color:var(--red)}
  .v-unknown{color:var(--muted-dim);font-style:italic;font-weight:600}

  .sys-foot{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--border);
       align-items:center}
  .sys-foot .btn{flex:1;text-align:center}
  .scan{font-size:10px;color:var(--muted-dim);font-family:var(--mono);
       padding:0 14px 12px;margin-top:-4px}

  .add-card{border:2px dashed var(--border);border-radius:var(--radius);display:grid;
       place-items:center;min-height:230px;color:var(--muted-dim);cursor:pointer;text-align:center}
  .add-card:hover{border-color:var(--brand);color:var(--brand)}
  .add-card .plus{font-size:26px;margin-bottom:6px}

  .empty{padding:44px;text-align:center;color:var(--muted-dim);background:var(--card);
       border:1px solid var(--border);border-radius:var(--radius)}
  .banner{padding:11px 15px;border-radius:var(--radius);margin-bottom:16px;font-size:12.5px;
       background:var(--amber-bg);border:1px solid var(--amber-br);color:var(--amber)}

  @media (max-width:900px){
    .sidebar{display:none}
    .content{padding:16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>



<main>
  <div class="topbar">
    <div>
      <h2>System Overview</h2>
      <div class="sub">Real-time status of all monitored systems</div>
    </div>
    <input class="search" id="search" placeholder="Filter systems, SIDs, hosts...">
    <div class="top-actions">
      <span id="sched-ctl" style="display:flex;gap:8px;align-items:center"></span>
      <button class="btn" id="theme">◐ Dark</button>
      <span id="run-ctl"></span>
    </div>
  </div>

  <div class="content">
    <div id="banner"></div>

    <div class="kpi-row" id="kpis"></div>

    <div class="section-head">
      <h3>Systems</h3>
      <span class="hint" id="gen">loading…</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="/static/shell.js?v=ds4"></script>
<script>
/* Every page here depends on shell.js for the sidebar, theme and helpers.
   If it fails to load the page renders bare with only a console error, which
   looks like the app is broken rather than one asset being missing. Say so
   on screen instead. */
if (typeof IB === "undefined") {
  document.body.innerHTML =
    '<div style="font-family:system-ui;padding:40px;max-width:640px;margin:0 auto">' +
    '<h2 style="margin-bottom:10px">Shared assets did not load</h2>' +
    '<p style="color:#666;line-height:1.6">This page needs ' +
    '<code>/static/shell.js?v=ds4</code> and <code>/static/shell.css?v=ds4</code>. ' +
    'They are missing or the static mount is not serving them.</p>' +
    '<p style="color:#666;line-height:1.6">Check that ' +
    '<code>dashboard/static/shell.js?v=ds4</code> exists, then restart the server. ' +
    'If you are seeing this inside a preview pane rather than at ' +
    '<code>127.0.0.1:8000</code>, that is expected — there is no server ' +
    'behind a preview.</p></div>';
}
</script>
<script>
IB.mountShell("overview");
IB.mountSchedulerControl("sched-ctl");
IB.mountRunControl("run-ctl");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA = null;

/* Theme ------------------------------------------------------------------ */
const savedTheme = document.documentElement.getAttribute("data-theme");
$("theme").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  $("theme").textContent = dark ? "◐ Dark" : "◑ Light";
};

/* Render ----------------------------------------------------------------- */
function kpis(c, incidents) {
  const cell = (lbl, num, cls, sub) =>
    `<div class="kpi ${cls}"><div class="lbl">${lbl}</div>
     <div class="num">${num}</div><div class="sub">${sub}</div></div>`;
  const pct = n => c.total ? Math.round(n / c.total * 100) + "% of fleet" : "—";

  $("kpis").innerHTML =
    cell("Total systems", c.total, "", "monitored") +
    cell("Healthy", c.healthy, "ok", pct(c.healthy)) +
    cell("Warning", c.warning, "warn", pct(c.warning)) +
    cell("Critical", c.critical, "crit", pct(c.critical)) +
    // Unknown is shown as its own KPI, never folded into healthy. A system
    // we could not reach is not a system in good health.
    cell("Unknown", c.unknown, "unk", "not reachable") +
    cell("Open incidents", incidents, "", "correlated");
}

function tile(label, t) {
  const st = (t.status || "UNKNOWN").toLowerCase();
  return `<div class="tile"><div class="k">${label}</div>
          <div class="v v-${st}">${esc(t.value)}</div></div>`;
}

function card(s) {
  const st = (s.status || "UNKNOWN").toLowerCase();
  const paths = (s.paths || []).map(p => `<span class="path p-${p}">${p}</span>`).join("");
  const meta = [
    s.sid ? `<span class="tag">${esc(s.sid)}</span>` : "",
    s.client ? `<span class="tag">CLIENT ${esc(s.client)}</span>` : "",
    s.host ? `<span>${esc(s.host)}</span>` : "",
  ].join("");

  const noData = s.metric_count === 0
    ? `<div class="scan" style="color:var(--amber)">No metrics collected —
       ${paths ? "configured for " + (s.paths || []).join(" + ") : "no collector configured"}</div>`
    : `<div class="scan">Last scan: ${esc(s.last_scan) || "never"} ·
       ${s.metric_count} metrics</div>`;

  return `<div class="sys s-${st}">
    <div class="sys-head">
      <div class="sys-title">
        <h4>${esc(s.name)}</h4>
        <span class="chip c-${st}">${esc(s.status)}</span>
      </div>
      <div class="sys-meta">${meta} ${paths}</div>
    </div>
    <div class="counts">
      <div><div class="n" style="color:var(--red)">${s.critical}</div><div class="t">Critical</div></div>
      <div><div class="n" style="color:var(--amber)">${s.warning}</div><div class="t">Warning</div></div>
      <div><div class="n" style="color:var(--gray)">${s.unknown}</div><div class="t">Unknown</div></div>
    </div>
    <div class="tiles">
      ${tile("CPU", s.tiles.cpu)}
      ${tile("Memory", s.tiles.memory)}
      ${tile("Dispatcher", s.tiles.dispatcher)}
      ${tile("ICM", s.tiles.icm)}
      ${tile("Gateway", s.tiles.gateway)}
      ${tile("Work processes", s.tiles.workprocess)}
      ${tile("SMLG response", s.tiles.smlg)}
      ${tile("Open incidents", {value: String(s.incidents), status: s.incidents ? "warning" : "normal"})}
    </div>
    ${noData}
    <div class="sys-foot">
      <a class="btn btn-primary" href="/system?name=${encodeURIComponent(s.name)}">Open dashboard</a>
    </div>
  </div>`;
}

function render() {
  if (!DATA) return;
  kpis(DATA.counts, DATA.incidents_open);
  $("gen").textContent = "as of " + (DATA.generated_at || "—");

  const q = $("search").value.trim().toLowerCase();
  const shown = DATA.systems.filter(s => !q ||
    [s.name, s.sid, s.host, s.client].join(" ").toLowerCase().includes(q));

  $("grid").innerHTML = shown.length
    ? shown.map(card).join("") +
      `<div class="add-card" onclick="location.href='/'">
         <div><div class="plus">+</div>Add a system<br>
         <small>configure in config/systems.yaml</small></div></div>`
    : `<div class="empty">No systems match “${esc(q)}”.</div>`;

  // Collector path coverage, from configuration rather than guesswork.
  const count = p => DATA.systems.filter(s => (s.paths || []).includes(p)).length;
  const n = DATA.systems.length;
  IB.updatePathCounts(DATA.systems);
  $("ch-points").textContent =
    DATA.systems.reduce((a, s) => a + (s.metric_count || 0), 0);

  const stale = DATA.systems.filter(s => s.metric_count === 0);
  $("banner").innerHTML = stale.length
    ? `<div class="banner"><strong>${stale.length} system(s) reported no metrics:</strong>
       ${stale.map(s => esc(s.name)).join(", ")}. They are shown as UNKNOWN rather than
       healthy — check the sweep log for the collector error.</div>`
    : "";
}

/* Data ------------------------------------------------------------------- */
async function load() {
  try {
    // /api/overview is a GET. This was IB.post(), which the server answers
    // with 405; IB.post does not treat that as an error, so r.json() failed
    // on the error body and the page fell into the catch every time.
    DATA = await IB.get("/api/overview");
    render();
  } catch (e) {
    $("grid").innerHTML =
      `<div class="empty">Could not reach /api/overview — is the server running?</div>`;
  }
}

$("search").oninput = render;

// The sweep button (#run) is not in this page's markup, only its handler
// was. Assigning .onclick on null threw at script top level, which aborted
// everything after it -- including poll() -- so the page never loaded any
// data at all. Guard it: the button is optional here; sweeps belong on the
// Systems page, where launching SAP GUI is the operator's deliberate choice.
const runBtn = $("run");
if (runBtn) runBtn.onclick = async () => {
  const b = runBtn;
  b.disabled = true; b.textContent = "Sweeping…";
  try { await fetch("/api/run-now"); } catch (e) {}
  poll();
};

async function poll() {
  const b = $("run");   // optional on this page
  try {
    const r = await fetch("/api/run-status");
    const s = await r.json();
    if (s.running) {
      if (b) b.textContent = "Sweeping" + (s.current_system ? ` ${s.current_system}…` : "…");
      setTimeout(poll, 2000);
      return;
    }
  } catch (e) {}
  if (b) { b.disabled = false; b.textContent = "Run sweep"; }
  load();
}

load();
IB.poll(load, 60000);   // paused while tab hidden
</script>
</body>
</html>
