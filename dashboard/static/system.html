<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraBeatOps · System detail</title>
<link rel="icon" href="/static/brand/favicon.png">
<script>(function(){var t=null;try{t=localStorage.getItem("ibo-theme");}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
<link rel="stylesheet" href="/static/shell.css?v=ds4">

  .tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .tab{padding:9px 15px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--brand-live);border-bottom-color:var(--brand-live)}

  .mtable td:first-child{font-family:var(--mono);font-size:11.5px}
  .xtra{font-family:var(--mono);font-size:10.5px;color:var(--muted-dim);white-space:pre-wrap;
        margin:4px 0 0;max-height:160px;overflow:auto}

</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <div class="crumb"><a href="/overview">Overview</a> › <span id="crumb">system</span></div>
      <h2 id="title">…</h2>
    </div>
    <div class="top-actions">
      <span id="livechip"></span>
      <button class="btn" id="theme">◑ Light</button>
    </div>
  </div>

  <div class="content">
    <div class="tabs">
      <div class="tab on" data-p="live">Live (RFC)</div>
      <div class="tab" data-p="metrics">Last sweep</div>
      <div class="tab" data-p="report">Health report</div>
    </div>

    <div class="pane on" id="p-live"><div class="empty">Reading…</div></div>
    <div class="pane" id="p-metrics"><div class="ibo-loading-inline"><img src="/static/brand/ibops-mark-64.png" alt=""><span>Reading live RFC…</span></div></div>
    <div class="pane" id="p-report"><div class="ibo-loading-inline"><img src="/static/brand/ibops-mark-64.png" alt=""><span>Reading live RFC…</span></div></div>
  </div>
</main>

<script src="/static/shell.js?v=ds4"></script>
<script>
/* Every page here depends on shell.js for the sidebar, theme and helpers.
   If it fails to load the page renders bare with only a console error, which
   looks like the app is broken rather than one asset being missing. Say so
   on screen instead. */
if (typeof IB === "undefined") {
  document.body.innerHTML =
    '<div style="font-family:system-ui;padding:40px;max-width:640px;margin:0 auto">' +
    '<h2 style="margin-bottom:10px">Shared assets did not load</h2>' +
    '<p style="color:#666;line-height:1.6">This page needs ' +
    '<code>/static/shell.js?v=ds4</code> and <code>/static/shell.css?v=ds4</code>. ' +
    'They are missing or the static mount is not serving them.</p>' +
    '<p style="color:#666;line-height:1.6">Check that ' +
    '<code>dashboard/static/shell.js?v=ds4</code> exists, then restart the server. ' +
    'If you are seeing this inside a preview pane rather than at ' +
    '<code>127.0.0.1:8000</code>, that is expected — there is no server ' +
    'behind a preview.</p></div>';
}
</script>
<script>
IB.mountShell("systems");
IB.themeToggle(document.getElementById("theme"));
const NAME = new URLSearchParams(location.search).get("name") || "";
document.getElementById("title").textContent = NAME;
document.getElementById("crumb").textContent = NAME;
let _aiHtml = "";  // last live-AI narrative, preserved across the 10s refresh

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  document.getElementById("p-" + t.dataset.p).classList.add("on");
});

function kpi(l, v, cls, sub) {
  return `<div class="kpi"><div class="lbl">${l}</div><div class="num ${cls||''}">${v}</div>
          ${sub?`<div class="sub">${sub}</div>`:""}</div>`;
}

/* Status -> number colour, so a KPI tile agrees with the chip in the table. */
function numCls(status) {
  return {CRITICAL:"n-red", WARNING:"n-amber", NORMAL:"n-green"}[status] || "n-info";
}

/* Age badge for the perf block: it refreshes on a slower clock than the
   rest of the live read, and the page must say so rather than imply 10s. */
function ageBadge(sec) {
  if (sec === null || sec === undefined) return "";
  const s = Math.round(sec);
  return `<span class="src src-rfc">RFC LIVE · ${s < 5 ? "just read" : s + "s ago"}</span>`;
}

/* One KPI per headline perf metric. Missing metric -> "—", never 0. */
function perfTiles(perf) {
  const by = {};
  for (const m of (perf.metrics || [])) by[m.metric] = m;
  const t = (name, label, unit) => {
    const m = by[name];
    if (!m) return kpi(label, IB.val(null), "n-info");
    const sub = (m.detail || "").split(";")[0].slice(0, 48);
    return kpi(label, IB.esc(m.display_value), numCls(m.status), IB.esc(sub));
  };
  return `<div class="grid g4" style="margin-bottom:16px">
    ${t("sap.st03.dialog_resp_ms", "Dialog response")}
    ${t("sap.st03.db_time_pct", "DB share of response")}
    ${t("sap.sm66.max_instance_saturation_pct", "Busiest instance")}
    ${t("sap.sm12.oldest_lock_minutes", "Oldest lock")}
  </div>`;
}

/* Every RFC metric, every field. Rows with extra_data get an expander so the
   per-instance / top-user / lock-owner detail is one click away. */
function allRfcTable(rows) {
  if (!rows || !rows.length) return '<div class="card-b"><div class="empty">No RFC metrics returned.</div></div>';
  return `<table class="mtable">
    <tr><th>Metric</th><th>T-code</th><th>Value</th><th>Status</th><th>Detail</th><th>Collector</th></tr>
    ${rows.map(m => {
      const hasExtra = m.extra && Object.keys(m.extra).length;
      const thr = (m.threshold_warning !== null && m.threshold_warning !== undefined)
        ? ` <span style="color:var(--muted-dim)">(warn ${m.threshold_warning}${m.unit||""} · crit ${m.threshold_critical}${m.unit||""})</span>` : "";
      return `<tr>
        <td>${IB.esc(m.metric)}<div style="font-family:system-ui;color:var(--muted-dim);font-size:11px">${IB.esc(m.label)}</div></td>
        <td class="mono">${IB.esc(m.tcode)}</td>
        <td class="mono">${IB.esc(m.display_value)}${thr}</td>
        <td><span class="chip ${IB.statusClass(m.status)}">${IB.esc(m.status)}</span></td>
        <td style="color:var(--muted-dim);font-size:11.5px">${IB.esc(m.detail||"")}
          ${hasExtra ? `<details class="xd"><summary>data</summary><pre class="xtra">${IB.esc(JSON.stringify(m.extra, null, 1))}</pre></details>` : ""}</td>
        <td class="mono" style="font-size:10.5px;color:var(--muted-dim)">${IB.esc(m.collector||"")}<br>${IB.esc(m.read_at||"")}</td>
      </tr>`; }).join("")}
  </table>`;
}

async function loadLive() {
  const el = document.getElementById("p-live");
  try {
    const s = await IB.get("/api/live/" + encodeURIComponent(NAME));
    IB.heartbeat.beat({ live: s.connected ? 1 : 0, total: 1, critical: (s.checks || []).some(c => c.status === "CRITICAL") });
    document.getElementById("livechip").innerHTML = s.connected
      ? '<span class="chip c-live"><span class="pulse"></span> RFC live</span>'
      : '<span class="chip c-unknown">not reachable</span>';

    const wp = s.work_processes || {};
    const types = Object.entries(wp.by_type || {}).map(([k,v]) =>
      `<tr><td>${IB.esc(k)}</td><td class="mono">${v.in_use} / ${v.total}</td>
       <td class="mono">${v.free}</td></tr>`).join("");

    el.innerHTML = `
      ${s.error ? `<div class="banner banner-warn">${IB.esc(String(s.error).split("\n")[0])}
        ${s.cooldown ? ` · retrying in ${s.cooldown}s` : ""}</div>` : ""}
      <div class="grid g4" style="margin-bottom:16px">
        ${kpi("CPU", IB.val(s.cpu,"%",0), s.cpu>=80?"n-red":"n-green")}
        ${kpi("Memory", IB.val(s.memory,"%",0), s.memory>=85?"n-red":"n-green")}
        ${(s.load_1m === null || s.load_1m === undefined) && s.load_5m !== null && s.load_5m !== undefined
            ? kpi("Load 5m", IB.val(s.load_5m,"",2), "n-info", "CCMS RZ20")
            : kpi("Load 1m", IB.val(s.load_1m,"",2), "n-info")}
        ${kpi("Sessions", IB.val(s.users,"",0), "n-info")}
      </div>
      ${perfTiles(s.perf || {})}
${(s.perf && s.perf.error && !(s.perf.metrics||[]).length)
        ? `<div class="banner banner-warn">Performance read: ${IB.esc(String(s.perf.error).split("\n")[0])}</div>` : ""}
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>T-code checks</h3>
          <span class="src src-rfc">${IB.esc(s.check_source || "RFC")} LIVE</span>
          <span class="src src-none">${(s.checks||[]).length} checks</span></div>
        ${(s.checks||[]).length ? `<table>
          <tr><th>T-Code</th><th>Check</th><th>Value</th><th>Status</th><th>Detail</th></tr>
          ${s.checks.map(c=>`<tr>
            <td class="mono"><b>${IB.esc(c.tcode)}</b></td>
            <td>${IB.esc(c.label)}</td>
            <td class="mono">${IB.esc(c.value)}</td>
            <td><span class="chip ${IB.statusClass(c.status)}">${IB.esc(c.status)}</span></td>
            <td style="color:var(--muted-dim);font-size:11.5px">${IB.esc(c.detail||"")}</td>
          </tr>`).join("")}
        </table>` : `<div class="card-b"><div class="empty">
            ${s.check_error ? IB.esc(s.check_error)
              : "No counters returned — system unreachable, or the Z function module is not installed."}
          </div></div>`}
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>All RFC data</h3>
          ${ageBadge(s.perf && s.perf.age_seconds)}
          <span class="src src-none">${(s.rfc_metrics||[]).length} metrics</span></div>
        ${allRfcTable(s.rfc_metrics)}
      </div>

      <div class="grid g2">
        <div class="card">
          <div class="card-h"><h3>Work processes</h3>
            <span class="src src-rfc">RFC LIVE</span></div>
          <div class="card-b">
            ${wp.available ? `
              <div style="font-size:24px;font-weight:800;font-family:var(--mono)">
                ${wp.in_use} <span style="color:var(--muted-dim);font-size:15px">/ ${wp.total} in use</span></div>
              <div class="bar" style="margin:9px 0 14px"><i class="${IB.barClass(wp.utilization_pct)}"
                style="width:${wp.utilization_pct||0}%"></i></div>
              <table><tr><th>Type</th><th>In use</th><th>Free</th></tr>${types}</table>
              ${wp.longest_running ? `<div style="margin-top:11px;font-size:11.5px;color:var(--amber);font-family:var(--mono)">
                Longest: WP ${IB.esc(wp.longest_running.wp)} ·
                ${Math.round(wp.longest_running.seconds/60)}m ·
                ${IB.esc(wp.longest_running.user||"system")} ${IB.esc(wp.longest_running.report||"")}</div>`:""}
            ` : '<div class="empty">No data</div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Instances &amp; services</h3></div>
          <div class="card-b">
            ${(s.instances||[]).length ? `<table>
              <tr><th>Instance</th><th>Host</th><th>Services</th></tr>
              ${s.instances.map(i=>`<tr><td class="mono">${IB.esc(i.name)}</td>
                <td class="mono">${IB.esc(i.host)}</td>
                <td class="mono" style="color:var(--muted-dim)">${IB.esc(i.services||"—")}</td></tr>`).join("")}
            </table>` : '<div class="empty">No data</div>'}
            <div style="margin-top:12px;display:flex;gap:18px;font-size:12px">
              <div><div class="lbl" style="font-size:9.5px;color:var(--muted-dim)">DISPATCHER</div>
                <b>${IB.esc(s.dispatcher.label)}</b></div>
              <div><div class="lbl" style="font-size:9.5px;color:var(--muted-dim)">ICM</div>
                <b>${IB.esc(s.icm.label)}</b></div>
              <div><div class="lbl" style="font-size:9.5px;color:var(--muted-dim)">RFC ROUND-TRIP</div>
                <b>${s.rfc_round_trip_ms !== null && s.rfc_round_trip_ms !== undefined
                     ? s.rfc_round_trip_ms + " ms " +
                       '<span class="src src-rfc">LIVE</span>'
                     : IB.val(null)}</b></div>
              <div><div class="lbl" style="font-size:9.5px;color:var(--muted-dim)">DIALOG RESPONSE (SMLG)</div>
                <b>${s.response_time ? IB.esc(s.response_time.value) + " " +
                    IB.srcBadge(s.response_time.source, s.response_time.age_minutes)
                    : IB.val(null)}</b></div>
            </div>
          </div>
        </div>
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="banner banner-err">${IB.esc(e.message)}</div>`;
  }
  // The 10s refresh rebuilds the pane, which would wipe a narrative the user
  // is still reading. Put it back.
  if (_aiHtml) {
    const out = document.getElementById("ai-out");
    if (out) out.innerHTML = _aiHtml;
  }
}

async function loadMetrics() {
  const el = document.getElementById("p-metrics");
  try {
    const d = await IB.get("/api/status/" + encodeURIComponent(NAME));
    if (!d.available) { el.innerHTML = '<div class="card"><div class="empty">No sweep has completed for this system. Live RFC data is on the Live tab.</div></div>'; return; }
    el.innerHTML = `<div class="card"><div class="card-h"><h3>Last scheduled sweep — all collectors (RFC + SSH + SAP GUI)</h3>
      <span class="src src-none">${IB.esc(d.cycle_timestamp||"")}</span></div>
      <table class="mtable"><tr><th>Metric</th><th>Value</th><th>Status</th><th>Detail</th></tr>
      ${(d.metrics||[]).map(m=>`<tr><td>${IB.esc(m.name)}</td>
        <td class="mono">${IB.esc(m.display_value)}</td>
        <td><span class="chip ${IB.statusClass(m.status)}">${IB.esc(m.status)}</span></td>
        <td style="color:var(--muted-dim);font-size:11.5px">${IB.esc(m.detail||"")}</td></tr>`).join("")}
      </table></div>`;
  } catch (e) { el.innerHTML = `<div class="banner banner-err">${IB.esc(e.message)}</div>`; }
}

async function loadReport() {
  const el = document.getElementById("p-report");
  try {
    const r = await IB.get("/api/report/" + encodeURIComponent(NAME));
    el.innerHTML = rcaPanel() + `<div class="banner" style="background:var(--info-bg);border:1px solid var(--info-br);color:var(--text)">
        ${IB.esc(r.summary)}</div>
      ${r.findings.map(f=>`<div class="card" style="margin-bottom:11px">
        <div class="card-h"><span class="chip ${IB.statusClass(f.severity)}">${IB.esc(f.severity)}</span>
          <h3>${IB.esc(f.tcode)} · ${IB.esc(f.observation)}</h3></div>
        <div class="card-b"><div style="color:var(--muted);margin-bottom:9px">${IB.esc(f.why_it_matters)}</div>
          <ol style="margin-left:17px;font-size:12.5px;line-height:1.7">
            ${f.solutions.map(x=>`<li>${IB.esc(x)}</li>`).join("")}</ol></div></div>`).join("")
        || '<div class="card"><div class="empty">No findings.</div></div>'}
      <div style="margin-top:10px"><a class="btn" href="/reports-page">Full report →</a></div>`;
  } catch (e) {
    el.innerHTML = rcaPanel() + `<div class="card"><div class="empty">No report yet — a sweep must complete first.</div></div>`;
  }
  refreshRcaStatus();
}

/* ---- Performance monitoring (emergency RCA) --------------------------
   One button, one status line. The RCA drives SAP GUI for several minutes
   and pre-empts a running sweep, so the button says what it is about to do
   before it does it, and the status line says where it got to. */
function rcaPanel() {
  return `<div class="card" style="margin-bottom:11px" id="rca-card">
    <div class="card-h"><h3>Performance monitoring</h3>
      <button class="btn btn-brand" id="rca-run" onclick="runRca()">Run performance RCA now</button></div>
    <div class="card-b">
      <div style="color:var(--muted);font-size:12.5px;margin-bottom:6px">
        Captures SM50 (by memory, PRIV), ST03N load windows, STAD slow steps, SM12 lock contention and
        ST04 database screens, runs OCR and model root-cause analysis, and emails the PDF to the Basis
        consultant. Fires automatically when dialog response stays over threshold; press to run it now.</div>
      <div id="rca-status" class="mono" style="font-size:11.5px;color:var(--muted-dim)">…</div>
    </div></div>`;
}

async function runRca() {
  const btn = document.getElementById("rca-run");
  if (btn) { btn.disabled = true; btn.textContent = "Starting…"; }
  try {
    const r = await IB.post("/api/perf-rca/" + encodeURIComponent(NAME), { label: "Starting performance RCA…" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      alert(d.detail || ("RCA could not start (HTTP " + r.status + ")"));
      if (btn) { btn.disabled = false; btn.textContent = "Run performance RCA now"; }
      return;
    }
    setRcaStatus(d.note || "Started.");
  } catch (e) {
    // IB.post throws on 401/503; say so rather than silently resetting the button.
    alert(e.message || "RCA request failed");
    if (btn) { btn.disabled = false; btn.textContent = "Run performance RCA now"; }
    return;
  }
  pollRca();
}

function setRcaStatus(text) {
  const s = document.getElementById("rca-status");
  if (s) s.textContent = text;
}

async function refreshRcaStatus() {
  try {
    const st = await IB.get("/api/perf-rca/" + encodeURIComponent(NAME) + "/status");
    const t = st.trigger || {};
    let line = t.enabled
      ? `auto-trigger: ${t.metric} > ${t.threshold_ms} ms for ${t.sustain_polls} polls · last ${t.last_value_ms ?? "—"} ms · streak ${t.consecutive_over}`
      : "auto-trigger disabled (IBO_ENABLE_RCA=0 or rca.yaml enabled: false)";
    if (t.cooldown_remaining_s > 0) line += ` · cooldown ${Math.ceil(t.cooldown_remaining_s/60)} min`;
    if (st.running) line = `RUNNING since ${st.started_at} — ` + line;
    else if (st.last && st.last.finished_at) {
      line = (st.last.ok
        ? `last: ${st.last.severity} — ${st.last.headline || ""} (${st.last.screens} screens${st.last.emailed ? ", emailed" : ""}) at ${st.last.finished_at}`
        : `last attempt failed: ${st.last.error || "?"} at ${st.last.finished_at}`) + " · " + line;
    }
    setRcaStatus(line);
    const btn = document.getElementById("rca-run");
    if (btn && !st.running) { btn.disabled = false; btn.textContent = "Run performance RCA now"; }
    return st;
  } catch (e) { setRcaStatus("status unavailable: " + (e.message || e)); return null; }
}

async function pollRca() {
  const st = await refreshRcaStatus();
  if (st && st.running) {
    const btn = document.getElementById("rca-run");
    if (btn) { btn.disabled = true; btn.textContent = "RCA running…"; }
    setTimeout(pollRca, 4000);
  }
}

function findingRow(f){
  return `<tr><td class="mono">${IB.esc(f.name)}</td>
    <td class="mono">${IB.esc(f.value)}</td>
    <td><span class="chip ${IB.statusClass(f.status)}">${IB.esc(f.status)}</span></td>
    <td style="color:var(--muted-dim);font-size:11.5px">${IB.esc(f.detail||"")}</td></tr>`;
}

async function analyseLive() {
  const btn = document.getElementById("ai-run");
  const out = document.getElementById("ai-out");
  if (!btn || !out) return;
  btn.disabled = true; const label = btn.textContent;
  btn.textContent = "Reading " + NAME + "…";
  out.innerHTML = '<div class="empty" style="padding:12px">Live RFC read, then one model call…</div>';
  try {
    const r = await IB.post("/api/rca/analyze/" + encodeURIComponent(NAME));
    const d = await r.json();

    if (d.analysed === false) {
      out.innerHTML = `<div class="banner banner-warn">${IB.esc(NAME)} did not answer over RFC — ${
        IB.esc(d.detail||"")}. No model call made, no tokens spent.</div>`;
      return;
    }
    const findings = (d.findings||[]).length
      ? `<table><tr><th>Metric</th><th>Value</th><th>Status</th><th>Detail</th></tr>
         ${d.findings.map(findingRow).join("")}</table>
         <div style="font-size:10.5px;color:var(--muted-dim);margin:6px 0 12px">
           Deterministic findings — computed before the model was called.</div>`
      : `<div class="empty" style="padding:10px">No metric outside threshold (${
           IB.esc(String(d.metric_count))} read).</div>`;

    const a = d.analysis || {};
    const li = arr => (arr && arr.length)
      ? `<ul style="margin:4px 0 0 18px;line-height:1.7">${arr.map(x=>`<li>${IB.esc(x)}</li>`).join("")}</ul>`
      : `<span style="color:var(--muted-dim)">none</span>`;
    const narrative = d.narrative_error
      ? `<div class="banner banner-err">Model call failed: ${IB.esc(d.narrative_error)}.
           The findings above are unaffected.</div>`
      : ((a.root_cause || d.narrative)
          ? `<div class="banner" style="background:var(--info-bg);border:1px solid var(--info-br);color:var(--text)">
               <div style="font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
                 color:var(--muted-dim);margin-bottom:5px">${IB.esc(a.finding_status||"HYPOTHESIS")} ·
                 ${IB.esc(a.root_cause_category||"analysis")}${a.confidence?" · "+IB.esc(a.confidence):""}</div>
               <div style="font-weight:600;margin-bottom:10px">${IB.esc(a.root_cause||d.narrative)}</div>
               <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                 <div><b style="font-size:11px">Supporting evidence</b>${li(a.supporting_evidence)}</div>
                 <div><b style="font-size:11px">Recommended actions</b>${li(a.recommended_actions)}</div>
               </div>
               ${(a.limitations&&a.limitations.length)?`<div style="margin-top:10px"><b style="font-size:11px">Limitations</b>${li(a.limitations)}</div>`:""}
             </div>`
          : `<div class="empty" style="padding:10px">No narrative returned.</div>`);

    // A single provider has .provider/.name; a key chain (FailoverProvider)
    // has .configured/.exhausted/.available instead -- show which key
    // actually answered, and how many are retired, rather than nothing.
    const prov = d.provider && (d.provider.provider || d.provider.name ||
      (d.provider.configured ? `${(d.provider.available||[]).length}/${d.provider.configured.length} keys live` : null));
    const who = IB.renderAttribution(d.attribution);
    _aiHtml = findings + narrative + (who ? `<div style="font-weight:700;font-size:12.5px;margin:14px 0 4px">Who and what</div>` + who : "") +
      `<div style="font-size:10.5px;color:var(--muted-dim);margin-top:8px">
         ${IB.esc(d.overall_status||"")} · ${IB.esc(String(d.metric_count||0))} metrics ·
         read ${IB.esc(d.read_at||"—")}${prov ? " · " + IB.esc(prov) : ""}</div>`;
    out.innerHTML = _aiHtml;
  } catch (e) {
    out.innerHTML = `<div class="banner banner-err">${IB.esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}
document.addEventListener("click", e => {
  if (e.target && e.target.id === "ai-run") analyseLive();
});

loadMetrics(); loadReport();
IB.poll(loadLive, 10000);   // paused while tab hidden
</script>
</body>
</html>
